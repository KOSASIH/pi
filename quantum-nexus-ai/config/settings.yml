# Quantum Nexus AI Configuration - Ultimate Hyper-Tech Settings
# This YAML file centralizes all configurable parameters for the platform, including environment-specific overrides, security keys, and module tunings.

# Global Settings
app:
  name: "Quantum Nexus AI"
  version: "1.0.0"
  environment: "development"  # Options: development, staging, production
  debug: true
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR

# AI Engine Configurations
ai_engine:
  quantum:
    num_qubits: 4
    backend: "aer_simulator"  # qiskit_aer.AerSimulator
    shots: 1024
    optimization_level: 2  # For transpilation
  swarm:
    num_agents: 10
    learning_rate: 0.01
    epochs: 100
    communication_timeout: 1.0  # seconds
  model_paths:
    quantum_weights: "models/quantum_model.pkl"
    swarm_checkpoint: "models/swarm_checkpoint.pth"

# Blockchain Configurations
blockchain:
  provider_url: "https://polygon-rpc.com/"  # Ethereum mainnet: https://mainnet.infura.io/v3/YOUR_PROJECT_ID
  chain_id: 137  # Polygon: 137, Ethereum: 1
  gas_limit: 2000000
  gas_price_gwei: 20
  private_key: "${PRIVATE_KEY}"  # Environment variable for security
  contract_addresses:
    nft_contract: "0xYourNFTContractAddress"
    oracle_contract: "0xYourOracleContractAddress"
  encryption:
    key_size: 2048
    hmac_key_length: 32

# IoT Mesh Configurations
iot:
  broker: "mqtt.eclipse.org"
  port: 1883
  topic: "quantum-nexus/sensors"
  qos: 1  # Quality of Service
  keepalive: 60
  fusion_model:
    type: "random_forest"
    n_estimators: 100
    max_depth: 10
  autonomous_threshold: 0.5  # For triggering actions

# API Configurations
api:
  host: "0.0.0.0"
  port: 8000
  reload: true  # For development
  workers: 4  # For production scaling
  cors_origins: ["*"]  # Allow all in dev; restrict in prod
  rate_limit: 100  # Requests per minute
  auth:
    jwt_secret: "${JWT_SECRET}"  # Environment variable
    token_expiry: 3600  # seconds

# CLI Configurations
cli:
  default_command: "help"
  output_format: "json"  # json, yaml, text
  async_timeout: 30  # seconds for async operations

# Security & Encryption
security:
  encryption:
    algorithm: "RSA-OAEP"  # Post-quantum hybrid
    key_derivation: "PBKDF2"
    iterations: 100000
  integrity:
    hmac_algorithm: "SHA256"
  lattice_crypto:
    enabled: false  # Set to true when liboqs is integrated
    key_exchange: "Kyber512"

# Database & Storage (if needed for extensions)
database:
  type: "sqlite"  # Options: sqlite, postgresql
  url: "sqlite:///quantum_nexus.db"
  pool_size: 10

# Monitoring & Performance
monitoring:
  prometheus_enabled: true
  grafana_dashboard: "dashboards/quantum_nexus.json"
  benchmark_thresholds:
    quantum_sim_time: 5.0  # seconds
    api_response_time: 0.1  # seconds

# CI/CD & Deployment
deployment:
  docker_image: "kosasih/quantum-nexus-ai:latest"
  k8s_namespace: "quantum-nexus"
  cloud_provider: "aws"  # aws, gcp, azure
  auto_scale:
    min_replicas: 1
    max_replicas: 10
    cpu_threshold: 70

# Environment Overrides
environments:
  production:
    debug: false
    log_level: "WARNING"
    api:
      reload: false
      workers: 8
    blockchain:
      provider_url: "https://mainnet.infura.io/v3/YOUR_PROJECT_ID"
  staging:
    environment: "staging"
    iot:
      broker: "test.mqtt.org"
