[package]
name = "hyper-pi"
version = "3.0.0"
edition = "2025"
authors = ["KOSASIH <kosasihg88@gmail.com>"]
description = "Ultimate super app for Pi Ecosystem: Autonomous platform for building, managing, and running internal applications with Pi Coin stablecoin ($314,159 fixed value), AI-driven isolation from volatile tech, Pi Network integration, and hyper-tech features like quantum simulation, telepathy, and consciousness uploading."
license = "MIT"

[dependencies]
tokio = { version = "1.0", features = ["full", "net", "io-util"] }  # Async runtime with networking and I/O for Pi Network and storage
hyper = "0.14"  # HTTP server for web interface
serde = { version = "1.0", features = ["derive"] }  # Serialization for configs and contracts
rpi-gpu = "0.1"  # Custom crate for Raspberry Pi GPU acceleration (mock if unavailable)
kvm-bindings = "0.6"  # KVM for virtualization
openssl = "0.10"  # Secure networking and encryption
tch = "0.10"  # PyTorch bindings for AI orchestration and filtering
rust-crypto = "0.2"  # AES encryption for secure data storage
rand = "0.8"  # Random number generation for simulations (quantum, teleportation, etc.)
chrono = { version = "0.4", features = ["serde"] }  # Timestamps for analytics and logging
